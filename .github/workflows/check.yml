# Runs the site checker on every push to main and on pull requests.
# A red cross on the commit means tools/check.py found an ERROR (see the log). The site itself is still
# built and published by GitHub Pages ("pages build and deployment"), this only reports problems.
name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jekyll and PyYAML
        run: |
          gem install jekyll:3.10.0 kramdown-parser-gfm jekyll-sitemap webrick
          pip install pyyaml
      - name: Check data, links and build
        run: python3 tools/check.py --build
